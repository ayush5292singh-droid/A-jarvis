<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <div class="title">J.A.R.V.I.S</div>
  <div class="small">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

  <div id="orb" class="orb">
    <div class="r r1"></div>
    <div class="r r2"></div>
    <div class="r r3"></div>
    <div class="core"></div>
  </div>

  <div id="status">STANDBY</div>

  <div id="answer">Systems ready.</div>

  <div class="bar">

    <input
      id="input"
      type="text"
      placeholder="Speak or type..."
      autocomplete="off"
    >

    <button id="mic">🎙️</button>

    <button id="send">➤</button>

  </div>

</div>


<div id="hidden">

  <div class="hiddenTitle">J.A.R.V.I.S</div>

  <button id="show">SHOW JARVIS</button>

</div>


<script src="script.js"></script>

</body>
</html>
